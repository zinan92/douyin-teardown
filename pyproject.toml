[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-teardown"
version = "0.1.0"
description = "一条抖音视频为什么爆：下载 → 转文字 → 点赞倍数 → 带时间戳的结构拆解"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # content_downloader
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "filelock>=3.13",
    "pyyaml>=6.0",
    "gmssl>=3.2.2",
    "yt-dlp>=2024.0",
    # content_extractor
    "orjson>=3.10",
    "typer>=0.24",
    "rich>=14.0",
    "trafilatura>=2.0,<3",
    "faster-whisper>=1.2,<2",
    "anthropic>=0.86,<1",
    "Pillow>=11,<12",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
teardown = "douyin_teardown.cli:main"
content-downloader = "content_downloader.cli:main"
content-extractor = "content_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["douyin_teardown*", "content_downloader*", "content_extractor*"]

[tool.setuptools.package-data]
douyin_teardown = ["glossary.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
